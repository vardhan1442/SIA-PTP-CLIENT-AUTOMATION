<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run dashboard - Sign in</title>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#173149;background:#f5f8fa;--blue:#116baf;--orange:#ef8a27;--line:#dce7ec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 89% -10%,rgba(239,138,39,.18),transparent 36%),linear-gradient(112deg,#0b304f 0%,#115c94 68%,#1473ae 100%)}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 32px rgba(17,57,88,.25);padding:32px;width:min(360px,92vw)}
h1{font-size:20px;margin:0 0 4px;color:#0b304f}
p.tagline{color:#536b7c;font-size:13px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#16486d}
input{width:100%;border:1px solid #cbdce6;border-radius:10px;padding:11px 14px;font:inherit}
button{margin-top:20px;width:100%;border:1px solid var(--orange);background:var(--orange);color:#192f40;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
button:hover{background:#ffac52}
button:disabled{opacity:.6;cursor:default}
.error{margin-top:14px;background:#fff0eb;border-left:3px solid #d34d29;color:#8d2c16;padding:10px 13px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<form class="card" id="form">
 <h1>Run dashboard</h1>
 <p class="tagline">Sign in to continue.</p>
 <label for="username">Username</label>
 <input id="username" name="username" autocomplete="username" required>
 <label for="password">Password</label>
 <input id="password" name="password" type="password" autocomplete="current-password" required>
 <button id="submit" type="submit">Sign in</button>
 <div id="error" class="error" hidden></div>
</form>
<script>
"use strict";
const form=document.getElementById("form"),err=document.getElementById("error"),btn=document.getElementById("submit");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 err.hidden=true;btn.disabled=true;
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});
  const data=await r.json();
  if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);
  const next=new URLSearchParams(location.search).get("next");
  location.href=next&&next.startsWith("/")?next:"/";
 }catch(error){err.textContent=error.message;err.hidden=false}
 finally{btn.disabled=false}
});
</script>
</body>
</html>
